# Build the personal homepage and publish the generated site on the gh-pages branch.
name: Deploy homepage to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Publish the generated site to gh-pages
        run: |
          cp -a _site /tmp/homepage
          git fetch --depth=1 origin gh-pages || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -r -q --ignore-unmatch .
          git clean -fdx
          cp -a /tmp/homepage/. .
          touch .nojekyll
          git add -A
          published_tree=$(git rev-parse FETCH_HEAD^{tree} 2>/dev/null || echo "")
          if [ "$(git write-tree)" = "$published_tree" ]; then
            echo "The published site is already up to date."
          else
            git commit -q -m "Deploy the personal homepage"
            pushed=false
            for attempt in 1 2 3; do
              if git push --force origin gh-pages:gh-pages; then
                pushed=true
                break
              fi
              echo "Push attempt ${attempt} failed; retrying in 10 seconds."
              sleep 10
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not publish the generated site." >&2
              exit 1
            fi
          fi
      - name: Report Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/pages || echo "Pages is not enabled yet: choose Settings -> Pages -> Source: Deploy from a branch -> gh-pages / root."