name: Temporary Pages enablement check
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  administration: write

jobs:
  enable-pages:
    runs-on: ubuntu-24.04
    steps:
      - name: Enable Pages for the published branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/pages; then
            echo "Pages is already configured."
          else
            echo "Trying a branch-based Pages site..."
            gh api -X POST repos/${{ github.repository }}/pages \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/" || true
            echo "Trying an Actions-build Pages site..."
            gh api -X POST repos/${{ github.repository }}/pages -f build_type=workflow || true
          fi
          echo "=== Final Pages configuration ==="
          gh api repos/${{ github.repository }}/pages || echo "Pages could not be enabled by the workflow token."